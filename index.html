<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRRME</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f5f0}
.header{background:#0a0a0a;color:white;padding:20px;border-radius:0 0 30px 30px;height:280px;position:relative;overflow:hidden}
.header img{position:absolute;right:0;top:0;height:100%;width:55%;object-fit:cover}
.header-text{position:relative;z-index:2;width:60%}
h1{font-size:28px;margin:10px 0}
.sub{font-size:14px;opacity:0.8}
.card{background:white;margin:-40px 16px 0 16px;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
.nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0a0a0a;color:white;display:flex;gap:30px;padding:14px 30px;border-radius:50px}
</style>
</head>
<body>
<div class="header">
<div class="header-text">
<div id="today" style="font-size:13px;opacity:0.7"></div>
<h1>Welcome,<br>style muse.</h1>
<p class="sub">A small reflection from your wardrobe. Made for your shape, your culture, your day - as you are.</p>
</div>
<img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=400">
</div>
<div class="card">
<h3>Your Mirror</h3>
<p>Let's make today feel like you. No scoring, no shaming. Just your true reflection.</p>
</div>
<div class="nav"><span>Home</span><span>Wardrobe</span><span>Mirror</span></div>
<script>
document.getElementById('today').innerText = new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'});
</script>
</body>
</html>
